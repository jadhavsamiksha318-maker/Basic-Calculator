<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Task 2: Basic Calculator | Arithmetic Operations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, sans-serif;
        }

        body {
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .calculator-container {
            max-width: 480px;
            width: 100%;
           
            backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 1.8rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }

        .calculator-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            color: #eef5ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.7rem;
        }

        .display-screen {
            background: #8d9097;
            border-radius: 2rem;
            padding: 1.5rem 1.2rem;
            margin-bottom: 1.8rem;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05);
        }

        #display {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 2.8rem;
            font-weight: 600;
            color: #f3f6fe;
            text-align: right;
            outline: none;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.9rem;
        }

        button {
            background: #1e2538;
            border: none;
            padding: 1.1rem 0;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 1.8rem;
            color: #f0f4ff;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #0b0f18;
            font-family: monospace;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0b0f18;
        }

        .operator {
            background: #2d3e6e;
            color: #ffde9c;
        }

        .equals {
            background: #f39c12;
            color: #1e1f2c;
            box-shadow: 0 5px 0 #b36b00;
        }

        .clear {
            background: #c44536;
            color: white;
        }

        .zero {
            grid-column: span 2;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            text-align: center;
            color: #7c85aa;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1rem;
        }

        @media (max-width: 500px) {
            body { padding: 1rem; }
            button { padding: 0.9rem 0; font-size: 1.3rem; }
            #display { font-size: 2.2rem; }
            .buttons-grid { gap: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="calculator-container">
    
    <div class="display-screen">
        <input type="text" id="display" readonly value="0">
    </div>
    <div>
        
    </div>
    <div class="buttons-grid">
        <button class="clear" id="clearBtn">AC</button>
        <button class="operator" data-op="%">%</button>
        <button class="operator" data-op="/">÷</button>
        <button class="operator" data-op="*">×</button>

        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button class="operator" data-op="-">−</button>

        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button class="operator" data-op="+">+</button>

        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button class="equals" id="equalBtn">=</button>

        <button data-num="0" class="zero">0</button>
        <button data-num=".">.</button>
        <button class="operator" id="backspaceBtn">⌫</button>
    </div>
    
</div>

<script>
   
    const display = document.getElementById('display');
    let currentExpression = '';
    let justEvaluated = false;

    function updateDisplay(value) {
        display.value = value === '' ? '0' : value;
    }

    function handleNumber(num) {
        if (justEvaluated) {
            currentExpression = '';
            justEvaluated = false;
        }
        // Prevent multiple leading zeros unless it's decimal
        if (currentExpression === '0' && num !== '.') {
            currentExpression = num;
        } else {
            currentExpression += num;
        }
        updateDisplay(currentExpression);
    }

    function handleOperator(op) {
        if (justEvaluated) {
            justEvaluated = false;
        }
        if (currentExpression === '' && op !== '-') return;
        
        const lastChar = currentExpression.slice(-1);
        const operators = ['+', '-', '*', '/', '%'];
        
        if (operators.includes(lastChar)) {
           
            if (op === '-' && lastChar !== '-') {
                currentExpression += op;
            } else {
                currentExpression = currentExpression.slice(0, -1) + op;
            }
        } else {
            currentExpression += op;
        }
        updateDisplay(currentExpression);
    }

    function backspace() {
        if (justEvaluated) {
            currentExpression = '';
            justEvaluated = false;
            updateDisplay('0');
            return;
        }
        currentExpression = currentExpression.slice(0, -1);
        updateDisplay(currentExpression || '0');
    }

    function clearAll() {
        currentExpression = '';
        justEvaluated = false;
        updateDisplay('0');
    }

    function calculate() {
        if (currentExpression === '') {
            updateDisplay('0');
            return;
        }
        
        let expr = currentExpression
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/%/g, '*0.01');
        
       
        if (/[+\-*/]$/.test(expr)) {
            expr = expr.slice(0, -1);
        }
        
        try {
            let result = eval(expr);
            if (!isFinite(result)) throw new Error('Math Error');
            // Round to avoid floating point issues
            result = parseFloat(result.toFixed(10));
            currentExpression = result.toString();
            updateDisplay(currentExpression);
            justEvaluated = true;
        } catch (error) {
            updateDisplay('Error');
            currentExpression = '';
            justEvaluated = true;
            setTimeout(() => {
                if (display.value === 'Error') clearAll();
            }, 1500);
        }
    }

   
    document.querySelectorAll('[data-num]').forEach(btn => {
        btn.addEventListener('click', () => handleNumber(btn.getAttribute('data-num')));
    });

    document.querySelectorAll('[data-op]').forEach(btn => {
        btn.addEventListener('click', () => handleOperator(btn.getAttribute('data-op')));
    });

    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('equalBtn').addEventListener('click', calculate);
    document.getElementById('backspaceBtn').addEventListener('click', backspace);

   
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        
        
        if (/[\d.]/.test(key) && !e.ctrlKey && !e.altKey) {
            e.preventDefault();
            handleNumber(key);
        }
        
        else if (key === '+' || key === '-' || key === '*' || key === '/') {
            e.preventDefault();
            let op = key;
            if (key === '*') op = '*';
            if (key === '/') op = '/';
            handleOperator(op);
        }
        else if (key === '%') {
            e.preventDefault();
            handleOperator('%');
        }
        else if (key === 'Enter' || key === '=') {
            e.preventDefault();
            calculate();
        }
        else if (key === 'Escape') {
            e.preventDefault();
            clearAll();
        }
        else if (key === 'Backspace') {
            e.preventDefault();
            backspace();
        }
    });
</script>
</body>
</html>
